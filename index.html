<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cpaz</title>
  <meta name="description" content="cpaz. La simplicidad es la máxima sofisticación.">
  <meta name="theme-color" content="#05060a">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%23a78bfa'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='%2305060a'/><circle cx='16' cy='16' r='8' fill='none' stroke='url(%23g)' stroke-width='3'/><circle cx='16' cy='16' r='2.5' fill='url(%23g)'/></svg>">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav">
    <div class="wrap nav-inner">
      <span class="brand"><span class="mark" aria-hidden="true"></span><span>cpaz</span></span>
      <span class="chip"><span class="pulse"></span>v0.1</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <canvas id="neural" aria-hidden="true"></canvas>
      <div class="wrap hero-inner">
        <h1>Lo siguiente se está construyendo <span class="grad">aquí</span>.</h1>
        <p class="slogan">La simplicidad es la máxima sofisticación.</p>
      </div>
      <div class="scroll-hint mono" aria-hidden="true">↓</div>
    </section>

    <section class="section wrap">
      <div class="keys">
        <article>
          <span class="num mono">01</span>
          <h2>Agentes</h2>
          <p>Software que entiende y actúa.</p>
        </article>
        <article>
          <span class="num mono">02</span>
          <h2>Automatización</h2>
          <p>Menos pasos. Mismo resultado.</p>
        </article>
        <article>
          <span class="num mono">03</span>
          <h2>Producto</h2>
          <p>De la idea a algo que se usa.</p>
        </article>
      </div>
    </section>

    <section class="closing wrap">
      <p class="big">Lo complejo,<br>resuelto en <span class="grad">silencio</span>.</p>
      <p class="terminal mono" aria-label="Terminal"><span class="prompt">$</span> <span id="typed"></span><span class="caret"></span></p>
    </section>
  </main>

  <footer class="footer wrap mono">
    <span>© 2026 cpaz</span>
    <span>cpaz.es</span>
  </footer>

  <script src="script.js"></script>
